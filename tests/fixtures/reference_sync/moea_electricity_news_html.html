  <h1>經濟部能源署公布114年度電力排碳係數</h1>
  <p>發布日期：2026-06-02</p>
  <p>
    經濟部能源署今（2）日公布114年度電力排碳係數，相關數值如下：
  </p>
  <ul>
    <li>公用售電業之電力排碳係數為 0.467 公斤二氧化碳當量/度</li>
    <li>工業部門用電之電力排碳係數為 0.466 公斤二氧化碳當量/度</li>
    <li>住宅部門用電之電力排碳係數為 0.471 公斤二氧化碳當量/度</li>
  </ul>
  <p>
    企業溫室氣體盤查請依適用類別選用對應係數，各類別不可任意互用。
  </p>
