name: Feature request / 功能建議
description: Suggest an improvement to the product, workflow, or documentation.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Thank you for the suggestion. Explain the user problem first so the proposal can be evaluated against the product's auditability and safety goals.

  - type: textarea
    id: user_problem
    attributes:
      label: User problem
      description: What task is difficult or impossible today, and who experiences it?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed improvement
      description: Describe the desired behavior without including confidential company data.
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Product area
      options:
        - Guided onboarding
        - Company applicability
        - Emissions data and calculation
        - Reports and export
        - Regulatory references
        - Developer experience
        - Documentation
        - Other
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: What would success look like?
      description: List the outcome or acceptance criteria that would make the change useful.

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Optional workarounds or alternative approaches.

