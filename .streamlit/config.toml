[theme]
base = "light"
primaryColor = "#0F766E"
backgroundColor = "#F7F9FC"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#0F172A"
font = "sans-serif"

[client]
toolbarMode = "minimal"
showErrorDetails = "none"

[browser]
gatherUsageStats = false

[server]
# Must match carbon_ledger.intake.MAX_UPLOAD_MB (backend validation).
maxUploadSize = 10
