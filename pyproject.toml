[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "carbon_ledger"
version = "0.1.0"
description = "An auditable data pipeline that maps synthetic Taiwanese exporter activity records to GHG Protocol, EU CBAM, and IFRS S2 data readiness."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pandas",
    "duckdb",
    "pandera",
    "streamlit>=1.60,<2",
    "openpyxl>=3.1,<4",
    "reportlab>=4.2.5,<5",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "pypdf>=5.1,<6",
    "pypdfium2>=4.30,<6",
]
e2e = [
    "playwright>=1.49",
    "pytest-playwright>=0.6",
    "pypdf>=5.1,<6",
    "pypdfium2>=4.30,<6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
carbon_ledger = ["ui/assets/fonts/*", "ui/*.js", "ui/*.css"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
markers = [
    "e2e: browser end-to-end smoke tests (requires Playwright + Chromium)",
    "benchmark: optional slow benchmarks; run with CEL_INTAKE_BENCH=1",
]

[tool.ruff]
target-version = "py311"
line-length = 88
extend-exclude = ["*.js"]

[tool.ruff.lint]
# Minimal beginner-friendly rules: syntax/undefined names and import order.
select = ["E", "F", "I"]
